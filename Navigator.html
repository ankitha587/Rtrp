<html>
<head>
  <title>Navigation Bar</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
    }
    .navigation {
      background-color: #333;
      overflow: hidden;
    }
    .navigation a {
      float: left;
      display: block;
      color: #f2f2f2;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
    }
    .navigation a:hover {
      background-color: #1ec24a;
      color: rgb(240, 237, 237);
    }
    .navbar a.active {
      background-color: #ed6b14;
      color: rgb(29, 27, 27);
    }
    h1{
        text-align: center;
        color: rgb(234, 21, 21);
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
  </style>
</head>
<body>

  <div class="navigation">
    <a href="#" class="active">Class</a>
    <a href="#">Subjects</a>
    <a href="#">Section</a>
    <a href="#">Faculty</a>
  </div>
  <h1>NAVIGATOR</h1>
</body>
</html>
