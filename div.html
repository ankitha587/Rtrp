<html>
<head>
  <title>DIV</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      margin: 0;
    }
    .center-box {
      background-color: #1345cf;
      color: rgb(248, 244, 246);
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-align: center;
    }
    h1{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: rgb(23, 216, 71);
    }
  </style>
</head>
<body>

  <div class="center-box">
    <h1>DIV BOX</h1>
    <p>Box is at center</p>
  </div>
</body>
</html>
